<header>
    <nav class="navbar navbar-expand-lg bg-navbar py-2" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" routerLink="/inicio">
                <img src="/logo2.png" alt="PLAYHEAD" class="img-logo flotar" style="max-height: 40px; width: auto;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarNavMenu"
                aria-controls="navbarNavMenu" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <div class="offcanvas offcanvas-end bg-navbar" tabindex="-1" id="navbarNavMenu"
                aria-labelledby="navbarNavMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="navbarNavMenuLabel">Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav ms-lg-auto">
                        @for (item of allNavOptions; track $index) {

                            <li class="nav-item">
                                <a class="nav-link" routerLinkActive="active" [routerLink]="item.route">{{item.label}}</a>
                            </li>
                        }

                       

                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
