<div>
    <section class="banner" id="juegos-cartas">
        <p class="path"><a routerLink="/inicio">Inicio</a> / Juegos de Cartas</p>
        <h1>Juegos de Cartas</h1>
        <p class="banner_bajada">Partidas rápidas en cualquier mesa. Gran variedad de juegos.</p>
    </section>

    <h2 class="sc-title">CATÁLOGO</h2>
    <section class="aparecer container py-4">
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">

            @for (carta of juegosCartas; track carta.id) {
                <juego-card [juego]="carta"/>
            }
        </div>

    </section>

    <div class="paginacion" aria-label="Otras categorías">
        <a routerLink="/familiares">← Juegos Familiares</a>
        <a routerLink="/inicio" class="btn btn-primary">Volver al inicio</a>
        <a routerLink="/juegos-party">Juegos Party →</a>
    </div>

</div>
