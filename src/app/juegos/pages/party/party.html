<div>
    <section class="banner" id="juegos-party">
        <p class="path"><a routerLink="/inicio">Inicio</a> / Juegos Party</p>
        <h1>Juegos Party</h1>
        <p class="banner_bajada">Para fiestas y grupos grandes. Mientras más jugadores, mejor.</p>
    </section>

    <h2 class="sc-title">CATÁLOGO</h2>
    <section class="aparecer container py-4">
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">

            @for (party of juegosParty; track party.id) {
                <juego-card [juego]="party"/>
            }

        </div>

    </section>

    <div class="paginacion" aria-label="Otras categorías">
        <a routerLink="/cartas">← Juegos de Cartas</a>
        <a routerLink="/inicio" class="btn btn-primary">Volver al inicio</a>
        <a routerLink="/estrategia">Juegos de Estrategia →</a>
    </div>

</div>
