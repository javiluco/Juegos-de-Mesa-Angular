<th scope="row">{{juego().id}}</th>
<td>
    <div class="inventario-juego">
        @if(juego().imagen){
        <img [src]="juego().imagen" alt="" class="compra-img">
        } @else{
        <span class="compra-img inventario-sin-img" aria-hidden="true"> - </span>
        }
        <span>{{ juego().nombre }}</span>
    </div>
</td>
<td> {{ juego().categoria }}</td>
<td class="inventario-precio">{{juego().precio | currency:'CLP'}}</td>
<td>{{juego().stock}}</td>
<td>
    <div class="inventario-acciones">
        <button type="button" class="inventario-btn"  [attr.data-editar]="juego().id">Editar</button>
        <button type="button" class="inventario-btn peligro" [attr.data-eliminar]="juego().id">Eliminar</button>
    </div>
</td>
