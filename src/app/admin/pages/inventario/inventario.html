<div class="bg-color">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-12 mt-4">

                <div class="card mb-2 p-2">
                    <div class="card-body text-center">
                        <div class="container px-0">
                            <div class="row align-items-center justify-content-between mb-2">
                                <div class="col-auto">
                                    <h5 class="mb-0 fw-bold">Inventario de Juegos</h5>
                                </div>
                                <div class="col-auto">
                                    <button class="btn btn-primary btn-sm px-4">Nuevo Juego</button>
                                </div>
                            </div>
                        </div>

                        <div class="inventario-resumen">
                            <div>
                                <span class="resumen-num " id="stateJuegos">{{ totalJuegos() }}</span>
                                <span class="resumen-txt">Juegos</span>
                            </div>
                            <div>
                                <span class="resumen-num " id="stateUnidades">{{ totalUnidades() }}</span>
                                <span class="resumen-txt">Unidades en stock</span>
                            </div>
                            <div>
                                <span class="resumen-num " id="stateValor">{{ valorInventario() | currency:'CLP' }}</span>
                                <span class="resumen-txt">Valor del inventario</span>
                            </div>
                            <div>
                                <span class="resumen-num " id="stateSinStock">{{ sinStock() }}</span>
                                <span class="resumen-txt">Sin stock</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- inventario-->
                <div class="card mt-2 p-2">
                    <div class="card-body ">
                        <div class="row g-2 align-items-center justify-content-center">

                            <div class="row align-items-center justify-content-center mb-2">
                                <div class="col-auto">
                                    <h5 class="mb-0 fw-bold">HISTORIAL DE COMPRAS</h5>
                                </div>
                            </div>

                            <div class="table-responsive">
                                <table class="table align-middle inventario-tabla">
                                    <thead>
                                        <tr>
                                            <th scope="col">#</th>
                                            <th scope="col">Juego</th>
                                            <th scope="col">Categoria</th>
                                            <th scope="col">Valor</th>
                                            <th scope="col">Stock</th>
                                            <th scope="col"></th>
                                        </tr>
                                    </thead>
                                    <tbody class="table-group-divider" id="tablaJuegos">
                                        @for (juego of juegosIniciales(); track juego.id) {
                                            <tr inventario-table [juego]="juego"></tr>
                                        }

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
