<div class="bg-color">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <div class="card auth-card">
                    <div class="card-body">
                        <div class="bg-logo">
                            <img src="logo2.png" alt="">
                        </div>
                        <h5 class="card-title auth-title">¡Bienvenido de vuelta!</h5>
                        <h6 class="card-subtitle mb-2 text-body-secondary">Inicia sesión para seguir explorando
                            juegos.</h6>
                        <form class="" id="formulario-login" novalidate>
                            <div class="mb-3">
                                <label for="inputEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="inputEmail" aria-describedby="emailHelp">
                                <div class="invalid-feedback error-vacio">Este campo es obligatorio.</div>
                                <div class="invalid-feedback error-formato">Por favor poner un correo válido.</div>
                            </div>
                            <div class="mb-3">
                                <label for="inputPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="inputPassword">
                                <div class="invalid-feedback error-vacio">Este campo es obligatorio.</div>
                                <div class="invalid-feedback error-formato">Debe tener entre 6 y 18 caracteres, 1
                                    mayúscula y 1 número.</div>
                            </div>

                            <button type="submit" class="btn btn-primary mb-3 w-100">Ingresar</button>

                        </form>
                        <div class="text-center">
                            <p class="form-text mb-0">¿No tienes una cuenta? <a routerLink="/registro"
                                    class="link-social">Registrate aquí</a></p>
                            <p class="form-text"> ¿Olvidó su contraseña? <a routerLink="/recuperar-password"
                                    class="link-social">Recuperar aquí</a> </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
