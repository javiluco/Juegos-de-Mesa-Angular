<div class="bg-color">
    <div class="container">
        <div class="row align-items-center justify-content-center">
            <div class="col-12 col-sm-10 col-xl-8 mt-4">
                <div class="card ">
                    <div class="card-body">
                        <div class="bg-logo">
                            <img src="logo2.png" alt="">
                        </div>
                        <h5 class="card-title auth-title">¡Crea tu cuenta!</h5>
                        <h6 class="card-subtitle mb-2 text-body-secondary text-center">Regístrate y descubre ofertas
                            exclusivas en juegos de mesa.</h6>
                        <form id="formRegistro" novalidate>
                            <div class="row g-2">
                                <div class="col-md mb-3">
                                    <label for="inputName" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="inputName" name="inputName" required>
                                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                                </div>
                                <div class="col-md mb-3">
                                    <label for="inputLastname" class="form-label ">Apellido</label>
                                    <input type="text" class="form-control" id="inputLastname" name="inputLastname"
                                        required>
                                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                                </div>
                            </div>

                            <div class="row g-2">
                                <div class="mb-3 col-md">
                                    <label for="inputUsername" class="form-label ">Nombre de usuario</label>
                                    <input type="text" class="form-control" id="inputUsername" name="inputUsername"
                                        required>
                                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                                </div>
                                <div class="mb-3 col-md">
                                    <label for="inputBirthdate" class="form-label ">Fecha de nacimiento</label>
                                    <input type="date" class="form-control" id="inputBirthdate" name="inputBirthdate"
                                        required>
                                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="inputEmail" class="form-label ">Email</label>
                                <input type="email" class="form-control" id="inputEmail" name="inputEmail" required>
                                <div class="invalid-feedback">Ingresa un email válido.</div>
                            </div>
                            <div class="row g-2">
                                <div class="mb-3 col-md">
                                    <label for="inputPassword1" class="form-label ">Contraseña</label>
                                    <input type="password" class="form-control" id="inputPassword1"
                                        name="inputPassword1" required>
                                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                                </div>
                                <div class="mb-3 col-md">
                                    <label for="inputPassword2" class="form-label ">Repetir Contraseña</label>
                                    <input type="password" class="form-control" id="inputPassword2"
                                        name="inputPassword2" required>
                                    <div class="invalid-feedback" id="password2Feedback">Este campo es obligatorio.
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="inputAddress" class="form-label ">Dirección de despacho
                                    (opcional)</label>
                                <input type="text" class="form-control" id="inputAddress" name="inputAddress">
                            </div>

                            <div class="d-flex gap-2 justify-content-center mt-4">
                                <button type="submit" class="btn btn-primary w-100">Enviar</button>
                                <button type="reset" class="btn btn-secondary w-100" id="btnLimpiar">Limpiar</button>
                            </div>

                            <div class="text-center mt-3">
                                <p class="form-text">¿Ya tienes cuenta? <a routerLink="/login" class="link-social">Inicia
                                        sesión</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
